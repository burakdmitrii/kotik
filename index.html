<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Для тебя">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#03040a">
<title>Для тебя</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="preload" href="img/1.jpg" as="image">
<style>
  @property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
  :root{
    --bg:#03040a; --ink:#eef1f8; --muted:rgba(238,241,248,.62);
    --gold:#f3d9a4; --ice:#a9d4ff;
    --glass:rgba(255,255,255,.055); --line:rgba(255,255,255,.14);
    --serif:'Cormorant Garamond',Georgia,serif; --sans:'Manrope',-apple-system,system-ui,sans-serif;
    --ease:cubic-bezier(.2,.8,.2,1);
    --e:.35; --lo:.35; --b:0;   /* громкость, бас и удар — обновляются в такт музыке */
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{position:fixed;width:100%;height:100%}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);overscroll-behavior:none;
    font-family:var(--sans);touch-action:manipulation;-webkit-text-size-adjust:100%;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  body{height:100vh;height:100dvh}
  button{font-family:inherit;-webkit-appearance:none;appearance:none;cursor:pointer}
  img{-webkit-user-drag:none;pointer-events:none}
  #sky{position:fixed;inset:0;width:100%;height:100%;z-index:0}
  #vignette{position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(ellipse 120% 90% at 50% 45%,transparent 45%,rgba(0,0,0,.55) 100%)}
  #fx{position:fixed;inset:0;width:100%;height:100%;z-index:20;pointer-events:none}

  /* ---------- загрузка ---------- */
  #loader{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;
    transition:opacity 1.3s ease}
  #loader.gone{opacity:0;pointer-events:none}
  #loader .lstar{width:10px;height:10px;border-radius:50%;background:#fff;animation:lpulse 1.6s ease-in-out infinite;
    box-shadow:0 0 10px 3px #fff,0 0 40px 12px rgba(243,217,164,.55),0 0 90px 30px rgba(169,212,255,.2)}
  @keyframes lpulse{50%{transform:scale(1.6);box-shadow:0 0 14px 5px #fff,0 0 60px 20px rgba(243,217,164,.7),0 0 120px 50px rgba(169,212,255,.25)}}
  #loader p{margin:0;font-size:10px;letter-spacing:.4em;text-transform:uppercase;color:var(--muted);animation:lfade 1.6s ease-in-out infinite}
  @keyframes lfade{50%{opacity:.35}}

  /* ---------- сцены и переходы ---------- */
  .scene{position:fixed;inset:0;max-width:430px;margin:0 auto;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:max(28px,env(safe-area-inset-top)) 24px max(28px,env(safe-area-inset-bottom));text-align:center;
    opacity:0;visibility:hidden;pointer-events:none;transition:opacity .9s ease,visibility 0s .9s,transform .9s var(--ease),filter .9s}
  .scene.active{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .9s ease .25s,visibility 0s}
  .scene.leave{transform:scale(1.15);filter:blur(10px)}
  .scene>*{opacity:0;transform:translateY(26px) scale(.98);filter:blur(6px);
    transition:opacity .9s ease,transform 1s var(--ease),filter .9s ease}
  .scene.active>*{opacity:1;transform:none;filter:none;transition-delay:calc(.35s + var(--i,0)*.14s)}
  .pop{animation:pop .7s var(--ease) both}
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.92);filter:blur(4px)}}

  h1,h2{font-family:var(--serif);font-weight:500;margin:0;letter-spacing:.01em}
  h1{font-size:clamp(44px,12.5vw,60px);line-height:1.02}
  h2{font-size:clamp(34px,10vw,44px);line-height:1.08}
  .eyebrow{display:flex;align-items:center;justify-content:center;gap:12px;font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--muted);margin:0 0 16px}
  .eyebrow::before,.eyebrow::after{content:'';width:26px;height:1px;background:linear-gradient(90deg,transparent,rgba(243,217,164,.7))}
  .eyebrow::after{background:linear-gradient(90deg,rgba(243,217,164,.7),transparent)}
  .sub{font-weight:300;font-size:15px;color:var(--muted);margin:16px 0 0;line-height:1.6;max-width:300px}

  .btn{position:relative;overflow:hidden;margin-top:34px;border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:15px 38px;
    font:600 12px var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--ink);
    background:rgba(255,255,255,.04);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    box-shadow:0 0 24px rgba(169,212,255,.15),inset 0 0 12px rgba(255,255,255,.05);transition:transform .2s,background .3s}
  .btn::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
    background:conic-gradient(from var(--ang),transparent 0 55%,rgba(243,217,164,.95) 72%,rgba(169,212,255,.9) 84%,transparent 96%);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
    mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);animation:ang 3.6s linear infinite}
  @keyframes ang{to{--ang:360deg}}
  .btn::after{content:'';position:absolute;top:0;bottom:0;width:40%;left:-60%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);animation:shine 3.6s ease-in-out infinite 1.5s}
  @keyframes shine{0%{left:-60%}35%,100%{left:130%}}
  .btn:active{transform:scale(.95);background:rgba(255,255,255,.12)}
  .btn.ghost{border-color:var(--line);box-shadow:none;color:var(--muted)}
  .btn.ghost::after,.btn.ghost::before{display:none}
  .hidden{display:none!important}

  /* ---------- интро ---------- */
  .planet{position:relative;width:132px;height:132px;margin-bottom:46px}
  .planet .body{position:absolute;inset:0;border-radius:50%;z-index:2;animation:float 7s ease-in-out infinite;
    background:radial-gradient(circle at 32% 28%,#e9f2ff 0%,#8fb2ee 10%,#3d5cb4 30%,#16205a 58%,#05071a 80%);
    box-shadow:0 0 60px rgba(120,170,255,.35),0 0 140px rgba(90,110,220,.18),inset -18px -22px 40px rgba(0,0,0,.75)}
  .planet .body::before,.planet .body::after{content:'';position:absolute;left:-46%;right:-46%;top:41%;height:18%;border-radius:50%;
    border:1.5px solid rgba(243,217,164,.6);transform:rotate(-14deg);box-shadow:0 0 18px rgba(243,217,164,.25);z-index:-1}
  .planet .body::after{z-index:3;clip-path:inset(50% 0 0 0)}
  .planet .halo{position:absolute;inset:-34px;border-radius:50%;background:radial-gradient(circle,rgba(120,170,255,.3),transparent 65%);
    transform:scale(calc(.95 + var(--lo)*.3));opacity:calc(.45 + var(--e)*.55)}
  .planet .flare{position:absolute;left:24%;top:20%;width:3px;height:3px;border-radius:50%;z-index:4;background:#fff;
    box-shadow:0 0 8px 3px rgba(255,255,255,.9);animation:float 7s ease-in-out infinite}
  .planet .flare::before,.planet .flare::after{content:'';position:absolute;left:50%;top:50%;width:70px;height:1px;margin:-.5px 0 0 -35px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);animation:flare 4s ease-in-out infinite}
  .planet .flare::after{transform:rotate(90deg);width:40px;margin-left:-20px}
  @keyframes flare{50%{opacity:.35}}
  @keyframes float{50%{transform:translateY(-10px)}}
  .moon{position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%,#fff,#b9c2d6 45%,#3a4058 100%);box-shadow:0 0 10px rgba(255,255,255,.45)}
  .title-chars .w{display:inline-block;white-space:nowrap}
  .title-chars .c{display:inline-block;opacity:0;transform:translateY(.4em) rotate(8deg);filter:blur(8px)}
  .scene.active .title-chars .c{animation:charIn 1s var(--ease) forwards;animation-delay:calc(.7s + var(--n)*.06s)}
  @keyframes charIn{to{opacity:1;transform:none;filter:none}}

  /* ---------- викторина ---------- */
  .qdots{display:flex;gap:6px;margin-bottom:24px}
  .qdots i{width:22px;height:2px;border-radius:1px;background:rgba(255,255,255,.18);transition:background .5s,box-shadow .5s}
  .qdots i.on{background:var(--gold);box-shadow:0 0 8px var(--gold)}
  #qbox{width:100%;display:flex;flex-direction:column;align-items:center;transition:opacity .45s,transform .45s var(--ease),filter .45s}
  #qbox.swap{opacity:0;transform:translateX(-40px);filter:blur(6px)}
  #qmain,#qres{width:100%;display:flex;flex-direction:column;align-items:center}
  .qtext{max-width:340px;min-height:2.2em;display:flex;align-items:center}
  .opts{display:flex;flex-direction:column;gap:9px;width:min(340px,100%);margin-top:22px}
  .opt{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:16px;padding:12px 16px;font:400 15px/1.35 var(--sans);color:var(--ink);
    background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);text-align:left;
    transition:transform .15s,background .3s,border-color .3s,box-shadow .3s,opacity .4s}
  .opt::before{content:attr(data-k);flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font:600 10px var(--sans);color:var(--muted);transition:all .3s}
  .scene.active .opt{animation:optIn .6s var(--ease) both;animation-delay:calc(var(--n)*.07s + .1s)}
  @keyframes optIn{from{opacity:0;transform:translateX(30px);filter:blur(4px)}}
  .opt:active{transform:scale(.98)}
  .opt.ok{border-color:rgba(243,217,164,.85);background:rgba(243,217,164,.13);box-shadow:0 0 26px rgba(243,217,164,.3)}
  .opt.ok::before{content:'✓';background:var(--gold);border-color:var(--gold);color:#0b0e20;font-size:12px}
  .opt.dim{opacity:.35}
  .opt.bad{border-color:rgba(255,120,120,.6);animation:shake .45s!important}
  .opt.bad::before{border-color:rgba(255,120,120,.6);color:rgba(255,150,150,.9)}
  @keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
  .qmsg{min-height:44px;margin:16px 0 0;font-weight:300;font-size:14px;line-height:1.55;color:var(--muted);max-width:320px;opacity:0;transition:opacity .4s}
  .qmsg.show{opacity:1}
  #qnext{margin-top:12px}
  .qstars{display:flex;gap:12px;margin-bottom:26px}
  .qstars i{font-style:normal;font-size:24px;color:rgba(255,255,255,.14);transition:color .4s,text-shadow .4s,transform .6s var(--ease)}
  .qstars i.on{color:var(--gold);text-shadow:0 0 14px rgba(243,217,164,.95);transform:scale(1.2) rotate(72deg)}

  /* ---------- созвездие ---------- */
  #field{position:relative;width:100%;max-width:380px;height:48vh;height:48dvh;margin-top:16px}
  #clines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  #clines polyline{fill:none;stroke:rgba(243,217,164,.75);stroke-width:1;stroke-linejoin:round;
    filter:drop-shadow(0 0 4px rgba(243,217,164,.8));stroke-dasharray:1600;stroke-dashoffset:1600;transition:stroke-dashoffset 3.2s ease}
  #clines.draw polyline{stroke-dashoffset:0}
  #clines circle{fill:#fff8e8}
  .cstar{position:absolute;width:52px;height:52px;margin:-26px 0 0 -26px;border:0;background:none;padding:0;opacity:0}
  .scene.active .cstar{animation:starIn 1.1s var(--ease) both;animation-delay:calc(.9s + var(--n)*.28s)}
  @keyframes starIn{from{opacity:0;transform:scale(0) rotate(-90deg)}to{opacity:1;transform:none}}
  .cstar::before{content:'';position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3.5px;border-radius:50%;background:#fff;
    box-shadow:0 0 6px 2px #fff,0 0 20px 6px rgba(169,212,255,.55);transition:box-shadow .6s;
    transform:scale(calc(var(--s,1) + var(--b)*.55))}
  .cstar::after{content:'';position:absolute;inset:6px;border-radius:50%;border:1px solid rgba(255,255,255,.5);animation:ping 2.4s ease-out infinite}
  .cstar:nth-of-type(2n)::after{animation-delay:.8s}
  .cstar:nth-of-type(3n)::after{animation-delay:1.6s}
  @keyframes ping{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1.25);opacity:0}}
  .cstar.seen{--s:1.25}
  .cstar.seen::after{display:none}
  .cstar.seen::before{background:#fff8e8;box-shadow:0 0 8px 3px #fff8e8,0 0 28px 10px rgba(243,217,164,.55)}
  #field.done .cstar::before{animation:glow 2.6s ease-in-out infinite}
  @keyframes glow{50%{box-shadow:0 0 12px 5px #fff8e8,0 0 44px 18px rgba(243,217,164,.7)}}
  .cstar .lbl{position:absolute;top:44px;left:50%;transform:translateX(-50%) translateY(6px);white-space:nowrap;font-size:10px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--gold);opacity:0;transition:opacity .8s,transform .8s}
  .cstar.seen .lbl{opacity:.85;transform:translateX(-50%)}
  .progress{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);margin:12px 0 0;min-height:16px}

  .modal{position:fixed;inset:0;max-width:430px;margin:0 auto;z-index:15;display:flex;align-items:center;justify-content:center;padding:24px;
    background:rgba(2,3,10,.6);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:opacity .45s}
  .modal.open{opacity:1;pointer-events:auto}
  .mcard{position:relative;overflow:hidden;width:min(340px,100%);background:linear-gradient(170deg,rgba(255,255,255,.1),rgba(255,255,255,.03));
    border:1px solid var(--line);border-radius:24px;padding:34px 26px 26px;text-align:center;
    transform:translateY(30px) scale(.9) rotateX(20deg);opacity:0;transition:transform .6s var(--ease),opacity .5s}
  .mcard::before{content:'';position:absolute;left:15%;right:15%;top:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
  .mcard::after{content:'';position:absolute;width:220px;height:220px;left:50%;top:-150px;margin-left:-110px;border-radius:50%;
    background:radial-gradient(circle,rgba(243,217,164,.18),transparent 70%);pointer-events:none}
  .modal.open .mcard{transform:none;opacity:1}
  .mcard .ico{font-size:16px;color:var(--gold);text-shadow:0 0 12px rgba(243,217,164,.9);margin-bottom:10px}
  .mcard h3{font:500 32px/1.1 var(--serif);margin:0 0 12px;color:var(--gold)}
  .mcard p{font-weight:300;font-size:15px;line-height:1.65;margin:0;color:rgba(238,241,248,.85)}
  .mcard .btn{margin-top:24px;padding:12px 28px}

  /* ---------- колоды карточек ---------- */
  .deck{position:relative;width:min(300px,80vw);height:min(400px,52vh);height:min(400px,52dvh);margin-top:26px}
  .deck::before{content:'';position:absolute;inset:-22% -28%;border-radius:50%;pointer-events:none;
    background:radial-gradient(closest-side,rgba(169,212,255,.2),rgba(243,217,164,.07) 60%,transparent);
    transform:scale(calc(.88 + var(--lo)*.24));opacity:calc(.45 + var(--e)*.55)}
  .card{position:absolute;inset:0;border-radius:24px;touch-action:none;will-change:transform;
    transition:transform .65s var(--ease),opacity .5s,filter .5s}
  .card.drag{transition:none}
  .rcard{padding:30px 26px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;
    background:linear-gradient(165deg,#1b2045,#080a1a);border:1px solid #2a2f4a;
    box-shadow:0 24px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.08)}
  .rcard::before{content:'';position:absolute;width:240px;height:240px;right:-100px;top:-100px;border-radius:50%;
    background:radial-gradient(circle,rgba(169,212,255,.2),transparent 70%)}
  .rcard::after{content:'';position:absolute;width:200px;height:200px;left:-90px;bottom:-90px;border-radius:50%;
    background:radial-gradient(circle,rgba(243,217,164,.12),transparent 70%)}
  .rcard .dots{position:absolute;inset:0;opacity:.5;
    background-image:radial-gradient(1px 1px at 20% 30%,#fff,transparent),radial-gradient(1px 1px at 70% 20%,#fff,transparent),
      radial-gradient(1.5px 1.5px at 82% 70%,#f3d9a4,transparent),radial-gradient(1px 1px at 30% 80%,#fff,transparent),
      radial-gradient(1px 1px at 55% 55%,#a9d4ff,transparent),radial-gradient(1px 1px at 12% 62%,#fff,transparent)}
  .rcard .n{position:relative;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-bottom:18px}
  .rcard .n::before{content:'✦';display:block;font-size:14px;letter-spacing:0;margin-bottom:10px;text-shadow:0 0 10px rgba(243,217,164,.9)}
  .rcard .t{font:italic 500 clamp(26px,7.4vw,31px)/1.25 var(--serif);position:relative;z-index:1}
  .pcard{background:#0b0e20;border:1px solid #262b45;padding:10px 10px 0;box-shadow:0 24px 60px rgba(0,0,0,.65);display:flex;flex-direction:column}
  .pcard .ph{flex:1;border-radius:16px;overflow:hidden;position:relative}
  .pcard .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .pcard.top .ph img{animation:kb 9s ease-in-out infinite alternate}
  @keyframes kb{from{transform:scale(1)}to{transform:scale(1.09) translate(-1.5%,-1.5%)}}
  .pcard .ph::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(5,7,20,.45))}
  .pcard .ph::before{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;transform:translateX(-130%);
    background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.22) 50%,transparent 65%)}
  .pcard.top .ph::before{animation:sweep 5.5s ease-in-out infinite 1.4s}
  @keyframes sweep{0%{transform:translateX(-130%)}30%,100%{transform:translateX(130%)}}
  .pcard .cap{font:italic 500 21px/1.2 var(--serif);color:var(--ink);padding:14px 8px 16px;text-align:center}
  .hint{margin:20px 0 0;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
  .hint span{display:inline-block;animation:nudge 1.6s ease-in-out infinite}
  @keyframes nudge{50%{transform:translateX(6px)}}

  /* ---------- вопрос ---------- */
  .answer{display:flex;flex-direction:column;align-items:center}
  .orb{position:relative;width:16px;height:16px;border-radius:50%;background:#fff;margin-bottom:50px;
    box-shadow:0 0 10px 4px #fff,0 0 40px 14px rgba(243,217,164,.6),0 0 110px 40px rgba(169,212,255,.25);animation:pulse 3s ease-in-out infinite}
  .orb::after{content:'';position:absolute;left:50%;top:50%;width:120px;height:120px;margin:-60px;border-radius:50%;
    border:1px solid rgba(243,217,164,.4);transform:scale(calc(.55 + var(--lo)*.8));opacity:calc(.08 + var(--b)*.8)}
  @keyframes pulse{50%{transform:scale(1.25);box-shadow:0 0 14px 6px #fff,0 0 60px 20px rgba(243,217,164,.7),0 0 140px 60px rgba(169,212,255,.3)}}
  #yes{transform:scale(var(--k,1));transition:transform .35s var(--ease),background .3s,box-shadow .35s;
    box-shadow:0 0 calc(24px * var(--k,1)) rgba(243,217,164,calc((var(--k,1) - 1)*.7)),0 0 24px rgba(169,212,255,.15)}
  #no{margin-top:20px;padding:12px 26px}
  #no.run{position:fixed;z-index:6;margin:0;transition:left .32s var(--ease),top .32s var(--ease)}
  .no-spacer{height:62px;flex:none}
  .flash{position:fixed;inset:0;z-index:19;pointer-events:none;background:radial-gradient(circle,rgba(255,250,235,.95),rgba(255,250,235,0) 65%);
    animation:flash 1.4s ease-out forwards}
  @keyframes flash{from{opacity:1}to{opacity:0}}
  .nova{position:fixed;left:50%;top:50%;width:10px;height:10px;margin:-5px;border-radius:50%;z-index:19;pointer-events:none;
    border:2px solid rgba(255,248,232,.9);box-shadow:0 0 30px rgba(243,217,164,.8),inset 0 0 30px rgba(243,217,164,.5);
    animation:nova 1.8s ease-out forwards}
  .nova.n2{animation-delay:.18s;border-color:rgba(169,212,255,.8)}
  @keyframes nova{to{transform:scale(150);opacity:0}}

  /* ---------- письмо ---------- */
  .scene.scroll{justify-content:flex-start;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;
    padding-top:max(64px,calc(env(safe-area-inset-top) + 40px));padding-bottom:calc(max(60px,env(safe-area-inset-bottom)) + 30vh)}
  .scene.scroll>*{flex-shrink:0}
  .avatar{position:relative;width:150px;height:150px;margin-bottom:34px;flex:none}
  .avatar::before{content:'';position:absolute;inset:-34px;border-radius:50%;pointer-events:none;
    background:radial-gradient(closest-side,rgba(243,217,164,.32),rgba(169,212,255,.1) 60%,transparent);
    transform:scale(calc(.85 + var(--lo)*.35));opacity:calc(.4 + var(--e)*.6)}
  .avatar img{position:absolute;inset:14px;width:calc(100% - 28px);height:calc(100% - 28px);border-radius:50%;object-fit:cover;
    box-shadow:0 0 0 1px rgba(243,217,164,.6),0 0 40px rgba(243,217,164,.35),0 0 90px rgba(169,212,255,.25)}
  .avatar .ring{position:absolute;inset:0;border-radius:50%;border:1px dashed rgba(243,217,164,.45);animation:spin 18s linear infinite}
  .avatar .ring::after{content:'';position:absolute;top:-4px;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:#fff8e8;
    box-shadow:0 0 10px 3px rgba(243,217,164,.8)}
  .avatar .ring2{position:absolute;inset:-14px;border-radius:50%;border:1px solid rgba(169,212,255,.15);animation:spin 30s linear infinite reverse}
  .avatar .ring2::after{content:'';position:absolute;bottom:-3px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--ice);
    box-shadow:0 0 8px 2px rgba(169,212,255,.8)}
  @keyframes spin{to{transform:rotate(360deg)}}
  #letterLines{display:flex;flex-direction:column;gap:18px;max-width:330px}
  .lline{font:italic 500 23px/1.35 var(--serif);margin:0}
  .lline .wd{display:inline-block;opacity:0;transform:translateY(12px);filter:blur(7px);
    transition:opacity 1s ease,transform 1s var(--ease),filter 1s ease;transition-delay:calc(var(--w)*75ms)}
  .lline.show .wd{opacity:1;transform:none;filter:none}
  .lline.strong{font-style:normal;font-weight:600;color:#fff;text-shadow:0 0 24px rgba(243,217,164,.45)}
  .big{font-size:clamp(46px,13vw,62px);margin-top:36px;opacity:0;transform:scale(.8);filter:blur(10px);
    transition:opacity 1.6s ease,transform 1.8s var(--ease),filter 1.6s;
    background:linear-gradient(90deg,#fff 0%,var(--gold) 30%,#fff 50%,var(--gold) 70%,#fff 100%);background-size:200% auto;
    -webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 5s linear infinite}
  .scene.active>.big:not(.show){opacity:0;transform:scale(.8);filter:blur(10px)}
  .scene.active>.sign:not(.show),.scene.active>.again:not(.show){opacity:0}
  .big.show{opacity:1;transform:none;filter:drop-shadow(0 0 18px rgba(243,217,164,.45))}
  @keyframes sheen{to{background-position:-200% center}}
  .sign{font:italic 500 28px var(--serif);color:var(--gold);margin:26px 0 0;opacity:0;transition:opacity 1.6s}
  .sign.show{opacity:1}
  .again{margin-top:64px;opacity:0;transition:opacity 1.4s}
  .again.show{opacity:1}

  /* ---------- музыка ---------- */
  #mute{position:fixed;top:max(14px,env(safe-area-inset-top));right:14px;z-index:25;width:42px;height:42px;border-radius:50%;
    border:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    display:flex;align-items:flex-end;justify-content:center;gap:3px;padding:13px 0;opacity:0;transform:scale(.6);transition:opacity .6s,transform .6s var(--ease)}
  #mute.on{opacity:1;transform:none}
  #mute i{width:3px;height:100%;border-radius:2px;background:var(--gold);transform-origin:bottom;animation:eq 1s ease-in-out infinite}
  #mute i:nth-child(2){animation-delay:.25s}
  #mute i:nth-child(3){animation-delay:.5s}
  #mute.live i{animation:none}
  #mute.paused i{animation:none;transform:scaleY(.25)!important;background:var(--muted)}
  @keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div id="vignette"></div>
<button id="mute" aria-label="Музыка"><i></i><i></i><i></i></button>
<div id="loader"><div class="lstar"></div><p>Загружаю вселенную</p></div>

<!-- 0. Intro -->
<section class="scene">
  <div class="planet"><div class="halo"></div><div class="body"></div><div class="flare"></div><div class="moon" id="moon"></div></div>
  <p class="eyebrow">Сообщение для тебя</p>
  <h1 class="title-chars" id="hello"></h1>
  <p class="sub">Я собрал для тебя маленькую вселенную.<br>Включи звук и не спеши.</p>
  <button class="btn" data-next>Открыть</button>
</section>

<!-- 1. Quiz -->
<section class="scene">
  <p class="eyebrow">Глава первая</p>
  <div class="qdots" id="qdots"></div>
  <div id="qbox">
    <div id="qmain">
      <h2 class="qtext" id="qtext"></h2>
      <div class="opts" id="opts"></div>
      <p class="qmsg" id="qmsg"></p>
      <button class="btn hidden" id="qnext">Дальше</button>
    </div>
    <div id="qres" class="hidden">
      <div class="qstars" id="qstars"></div>
      <h2 id="qresTitle"></h2>
      <p class="sub" id="qresText"></p>
      <button class="btn" id="qresNext">Дальше</button>
    </div>
  </div>
</section>

<!-- 2. Constellation -->
<section class="scene">
  <p class="eyebrow">Глава вторая</p>
  <h2>Наше созвездие</h2>
  <p class="sub" style="margin-top:10px">Коснись каждой звезды</p>
  <div id="field"><svg id="clines"><polyline id="poly"/></svg></div>
  <p class="progress" id="prog"></p>
  <button class="btn hidden" id="starsNext" data-next>Дальше</button>
</section>

<!-- 3. Photos -->
<section class="scene">
  <p class="eyebrow">Глава третья</p>
  <h2>Моя вселенная</h2>
  <div class="deck" id="photoDeck"></div>
  <p class="hint">Свайп или тап <span>→</span></p>
</section>

<!-- 4. Reasons -->
<section class="scene">
  <p class="eyebrow">Глава четвёртая</p>
  <h2>Почему именно ты</h2>
  <div class="deck" id="reasonDeck"></div>
  <p class="hint">Свайп или тап <span>→</span></p>
</section>

<!-- 5. Question -->
<section class="scene" id="askScene">
  <div class="answer">
    <div class="orb"></div>
    <h1 id="question"></h1>
    <button class="btn" id="yes">Да</button>
    <button class="btn ghost" id="no">Нет</button>
  </div>
</section>

<!-- 6. Letter -->
<section class="scene scroll" id="letter">
  <div class="avatar"><span class="ring2"></span><span class="ring"></span><img id="avatarImg" alt=""></div>
  <p class="eyebrow">Последняя глава</p>
  <div id="letterLines"></div>
  <h1 class="big" id="love"></h1>
  <p class="sign" id="sign"></p>
  <button class="btn ghost again" id="again">Пройти ещё раз</button>
</section>

<div class="modal" id="modal"><div class="mcard" id="mcard"></div></div>
<canvas id="fx"></canvas>

<script>
/* ============================================================
   ✏️  ЗДЕСЬ МЕНЯЕШЬ ВСЁ НА СВОЁ — только этот блок
   ============================================================ */
const CONFIG = {
  name: "любимая",       // "Привет, ..."
  from: "Твой котик",    // подпись в конце
  music: "music.mp3",    // файл с музыкой рядом с index.html
  musicMap: "music.json",// заранее посчитанный ритм песни (для движения под музыку)

  // Викторина. Первый вариант в options — ПРАВИЛЬНЫЙ (на экране они перемешиваются сами)
  quiz: [
    { q: "Где мы познакомились?",
      options: ["В TikTok", "В Instagram", "В Telegram", "ВКонтакте", "В колледже"],
      ok: "В TikTok! Самое лучшее, что я там нашёл, — это ты.",
      bad: "Неа 😏 Подсказка: там все листают видосики" },
    { q: "Кто из нас написал первым?",
      options: ["Я", "Ты", "Мы написали одновременно", "Твоя подруга с твоего телефона", "Никто не помнит"],
      ok: "Конечно я 😎 И ни секунды не пожалел.",
      bad: "Хм, подумай ещё 😏" },
    { q: "Когда мы впервые увиделись вживую?",
      options: ["Когда я привёз тебе обои к общаге", "Случайно встретились на улице", "В кино", "На остановке", "В торговом центре"],
      ok: "Именно! Самые романтичные обои в мире 😂",
      bad: "Нет 🙃 Вспоминай про общагу…" },
    { q: "Где мы сидели на нашей первой прогулке?",
      options: ["На качелях во дворах", "В кафе", "На лавочке у колледжа", "На набережной", "В макдаке"],
      ok: "Да! У тебя был обед между парами, а я не хотел отпускать тебя обратно.",
      bad: "Нет, вспоминай: там ещё можно было качаться 😄" },
    { q: "Как ты меня называла?",
      options: ["Мочалка", "Пирожок", "Хомяк", "Булочка", "Тюлень"],
      ok: "Мочалка 😂 Но потом я всё-таки стал котиком и зайчиком.",
      bad: "Мимо 😅 Было куда смешнее…" },
    { q: "Где мы чаще всего гуляем в Гомеле?",
      options: ["В парке и на набережной", "В торговом центре", "В кино", "На вокзале", "В спортзале"],
      ok: "Наш парк и набережная. Там я готов гулять с тобой бесконечно.",
      bad: "Не-не, вспоминай наши долгие прогулки 🙈" }
  ],

  // Звёзды-моменты
  moments: [
    { title: "Первое сообщение",  text: "Мы познакомились в TikTok, и я написал первым. Тогда я дурачился и писал всякую ерунду, но ни капли об этом не жалею. Я и подумать не мог, что это приведёт к такой любви." },
    { title: "Обои к общаге",     text: "Наша первая встреча вживую. Я привёз обои, увидел тебя, и всё. Но это было всё, что мне нужно." },
    { title: "Первая прогулка",   text: "Твой обед между парами. Мы немного прошлись и сели во дворах на качели. Я не хотел, чтобы перерыв заканчивался, хотя ужасно стеснялся. Настолько сильно ты мне понравилась." },
    { title: "Парк и набережная", text: "Моё любимое место в Гомеле, потому что оно пропитано воспоминаниями о тебе." },
    { title: "Сегодня",           text: "Каждый день рядом с тобой лучше предыдущего." }
  ],

  // Фото (лежат в папке img)
  photos: [
    { src: "img/1.jpg", caption: "Моя самая сладкая, милая и любимая котя" },
    { src: "img/2.jpg", caption: "Самая милая зайка во вселенной" },
    { src: "img/3.jpg", caption: "Мой нежный котёнок" },
    { src: "img/4.jpg", caption: "Даже когда задумалась, ты прекрасна" }
  ],

  // Причины (карточки)
  reasons: [
    "С тобой даже обычный день становится особенным",
    "У тебя самая красивая улыбка на свете",
    "Ты моя буся, и никто не сравнится",
    "Ты делаешь меня лучше",
    "Рядом с тобой мне спокойно и интересно одновременно",
    "Ты невероятно добрая и настоящая, моя сладуся",
    "Я скучаю по тебе, даже когда мы только что расстались",
    "С тобой часы и дни пролетают как секунды, а то и быстрее",
    "Пожалуйста, никогда не грусти. Я люблю тебя так сильно, что никогда не смогу разлюбить",
    "Просто потому, что это ты"
  ],

  question: "Побудешь моей и дальше, буся?",
  noTexts: ["Нет", "Точно нет?", "Подумай ещё", "Ну пожалуйста", "Я же старался…", "Кнопка сломалась 😅", "Жми уже «Да»"],

  // Финальное письмо. Строки появляются по одной. "!" в начале = выделенная строка
  letterPhoto: "img/1.jpg",
  letter: [
    "Я люблю тебя так сильно, что это просто невозможно описать словами.",
    "Мне так плохо без тебя, что я не представляю, как жить, когда тебя нет рядом.",
    "Я хочу провести с тобой всю свою жизнь.",
    "Ты самое главное и самое ценное, что у меня есть.",
    "!Я без тебя не смогу."
  ],
  love: "Люблю тебя"
};
/* ============================================================ */

const $ = s => document.querySelector(s);
const scenes = [...document.querySelectorAll('.scene')];
const enterHooks = {};
let cur = 0;

// порядковые номера для каскадного появления элементов сцены
scenes.forEach(s => [...s.children].forEach((el,i) => el.style.setProperty('--i', i)));

function go(i){
  const old = scenes[cur];
  old.classList.remove('active'); old.classList.add('leave');
  setTimeout(()=>old.classList.remove('leave'), 1000);
  cur = i;
  scenes[cur].classList.add('active');
  Sky.warp();
  if(enterHooks[cur]) enterHooks[cur]();
}

/* ---------- glow sprite (общий для неба и эффектов) ---------- */
function makeSprite(rgb){
  const s = document.createElement('canvas'); s.width = s.height = 64;
  const g = s.getContext('2d'), gr = g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(.12,`rgba(${rgb},.9)`);
  gr.addColorStop(.35,`rgba(${rgb},.22)`); gr.addColorStop(1,`rgba(${rgb},0)`);
  g.fillStyle = gr; g.fillRect(0,0,64,64); return s;
}
const SPR = { white:makeSprite('255,255,255'), ice:makeSprite('170,205,255'), warm:makeSprite('255,214,170'), gold:makeSprite('243,217,164') };

/* ---------- Музыка ---------- */
const Music = (()=>{
  const btn = $('#mute'), bars = [...btn.children];
  let map = null, lastIdx = -1, imp = 0, idle = 0, started = false, muted = false;
  const sm = { e:.35, lo:.35, mid:.3, hi:.25 };
  const a = CONFIG.music ? new Audio(CONFIG.music) : null;

  // ритм песни посчитан заранее — звук играет как обычно, мы только подглядываем в карту
  if(a && CONFIG.musicMap){
    fetch(CONFIG.musicMap).then(r=>r.json()).then(d=>{
      const dec = s => Uint8Array.from(atob(s), ch => ch.charCodeAt(0));
      map = { fps:d.fps, n:d.n, low:dec(d.low), mid:dec(d.mid), high:dec(d.high), full:dec(d.full), beat:dec(d.beat) };
    }).catch(()=>{});
  }
  if(a){
    a.loop = true; a.preload = 'auto';
    btn.onclick = e => {
      e.stopPropagation();
      if(muted || a.paused){ muted = false; play(); }
      else { muted = true; a.pause(); btn.classList.add('paused'); }
    };
    // iOS ставит звук на паузу при сворачивании — возобновляем, когда она вернётся
    document.addEventListener('visibilitychange', ()=>{
      if(!started) return;
      if(document.hidden) a.pause(); else if(!muted) play();
    });
    a.addEventListener('pause', ()=>{ if(!muted && started && !document.hidden) setTimeout(play, 300); });
  }
  function play(){ a.play().then(()=>btn.classList.remove('paused')).catch(()=>btn.classList.add('paused')); }

  return {
    start(){ if(!a || started) return; started = true; btn.classList.add('on'); play(); },
    // k — сколько «кадров по 60 fps» прошло; возвращает плавные уровни 0..1 и импульс удара
    sample(k){
      imp *= Math.pow(.86, k);
      let e, lo, mid, hi, live = false;
      if(map && started && a && !a.paused){
        const i = Math.floor((a.currentTime + .05) * map.fps) % map.n;
        if(lastIdx >= 0){
          for(let j = lastIdx, s = 0; j !== i && s < 24; s++){ j = (j + 1) % map.n; if(map.beat[j]) imp = Math.max(imp, map.beat[j]/255); }
        }
        lastIdx = i; live = true;
        e = map.full[i]/255; lo = map.low[i]/255; mid = map.mid[i]/255; hi = map.high[i]/255;
      } else {
        lastIdx = -1; idle += k;
        e = .35 + .1*Math.sin(idle/80); lo = e; mid = e*.85; hi = e*.7;
      }
      const f = 1 - Math.pow(.7, k);
      sm.e += (e - sm.e)*f; sm.lo += (lo - sm.lo)*f; sm.mid += (mid - sm.mid)*f; sm.hi += (hi - sm.hi)*f;
      btn.classList.toggle('live', live);
      if(live) [sm.lo, sm.mid, sm.hi].forEach((v,n)=>bars[n].style.transform = `scaleY(${(.2 + .8*Math.min(1, v + (n ? 0 : imp*.3))).toFixed(3)})`);
      else bars.forEach(b=>b.style.transform = '');
      return { e:sm.e, lo:sm.lo, mid:sm.mid, hi:sm.hi, b:imp, live };
    }
  };
})();

/* ---------- Загрузка и интро ---------- */
(function(){
  const h = $('#hello'); let n = 0;
  ('Привет, ' + CONFIG.name).split(' ').forEach((word, wi) => {
    if(wi) h.append(' ');
    const w = document.createElement('span'); w.className = 'w';
    [...word].forEach(ch => { const c = document.createElement('span'); c.className = 'c'; c.textContent = ch; c.style.setProperty('--n', n++); w.appendChild(c); });
    h.appendChild(w);
  });
  // луна вращается вокруг планеты по наклонной орбите
  const moon = $('#moon'), tilt = -14*Math.PI/180;
  (function orbit(t){
    const a = t/2600, ex = Math.cos(a)*112, ey = Math.sin(a)*22;
    const x = ex*Math.cos(tilt) - ey*Math.sin(tilt), y = ex*Math.sin(tilt) + ey*Math.cos(tilt);
    moon.style.transform = `translate(${x}px,${y}px) scale(${.8 + .25*Math.sin(a)})`;
    moon.style.zIndex = Math.sin(a) > 0 ? 4 : 1;
    if(cur === 0) requestAnimationFrame(orbit); else moon.remove();
  })(0);

  // ждём шрифты и фото, чтобы она сразу увидела всё красивым
  const img = new Promise(r=>{ const im = new Image(); im.onload = im.onerror = r; im.src = CONFIG.letterPhoto; });
  const fonts = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
  Promise.race([Promise.all([img, fonts]), new Promise(r=>setTimeout(r, 3500))]).then(()=>setTimeout(()=>{
    $('#loader').classList.add('gone');
    setTimeout(()=>$('#loader').remove(), 1400);
    scenes[0].classList.add('active');
    Sky.warp(1.2);
  }, 700));
})();
document.querySelectorAll('[data-next]').forEach(b => b.addEventListener('click', () => {
  if(cur === 0) Music.start();
  go(cur + 1);
}));

/* ---------- Викторина ---------- */
let qi = 0, mistakes = 0;
const qd = $('#qdots');
CONFIG.quiz.forEach(()=>qd.appendChild(document.createElement('i')));
const shuffle = arr => { const a = arr.slice(); for(let i=a.length-1;i>0;i--){ const j = Math.random()*(i+1)|0; [a[i],a[j]] = [a[j],a[i]]; } return a; };
function showQ(){
  const q = CONFIG.quiz[qi], right = q.options[0];
  [...qd.children].forEach((d,i)=>d.classList.toggle('on', i <= qi));
  $('#qtext').textContent = q.q;
  $('#qmsg').classList.remove('show'); $('#qnext').classList.add('hidden');
  const box = $('#opts'); box.innerHTML = '';
  shuffle(q.options).forEach((t,i)=>{
    const b = document.createElement('button'); b.className = 'opt'; b.textContent = t;
    b.dataset.k = 'ABCDEFG'[i]; b.style.setProperty('--n', i);
    b.onclick = ()=>{
      if(box.querySelector('.ok')) return;
      const m = $('#qmsg');
      m.classList.remove('show'); void m.offsetWidth;
      if(t === right){
        box.querySelectorAll('.opt').forEach(o=>{ o.classList.remove('bad'); if(o !== b) o.classList.add('dim'); });
        b.classList.add('ok'); m.textContent = q.ok; m.classList.add('show');
        const nb = $('#qnext');
        nb.textContent = qi === CONFIG.quiz.length-1 ? 'Итоги' : 'Следующий вопрос';
        nb.classList.remove('hidden','pop'); void nb.offsetWidth; nb.classList.add('pop');
        const r = b.getBoundingClientRect();
        FX.burst(r.left + r.width/2, r.top + r.height/2, 26, 'gold', 4);
      } else {
        mistakes++;
        b.classList.remove('bad'); void b.offsetWidth; b.classList.add('bad');
        m.textContent = q.bad; m.classList.add('show');
      }
    };
    box.appendChild(b);
  });
}
function swapQ(fn){
  const qb = $('#qbox');
  qb.classList.add('swap');
  setTimeout(()=>{
    fn();
    qb.style.transition = 'none'; qb.style.transform = 'translateX(40px)';
    void qb.offsetWidth; qb.style.transition = ''; qb.style.transform = ''; qb.classList.remove('swap');
  }, 450);
}
const plural = (n, a, b, c) => { const m10 = n%10, m100 = n%100; return m10 === 1 && m100 !== 11 ? a : (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) ? b : c; };
function showResult(){
  $('#qmain').classList.add('hidden'); $('#qres').classList.remove('hidden');
  const st = $('#qstars'); st.innerHTML = '';
  CONFIG.quiz.forEach(()=>{ const i = document.createElement('i'); i.textContent = '✦'; st.appendChild(i); });
  const m = mistakes;

/* ---------- Колоды карточек (фото и причины) ---------- */
function makeDeck(el, items, cls, render, onDone){
  let i = 0;
  const cards = items.map((item,k)=>{
    const c = document.createElement('div'); c.className = 'card ' + cls;
    render(c, item, k);
    attachSwipe(c);
    el.appendChild(c);
    return c;
  });
  function layout(){
    cards.forEach((c,k)=>{
      if(k < i) return;
      const d = k - i;
      c.style.zIndex = 100 - k;
      c.style.transform = `translateY(${d*14}px) scale(${1 - d*.05}) rotate(${d ? (k%2 ? 3 : -3) : 0}deg)`;
      c.style.opacity = d > 2 ? 0 : 1;
      c.style.filter = d ? `brightness(${1 - d*.25})` : '';
      c.classList.toggle('top', d === 0);
    });
  }
  function attachSwipe(c){
    let sx = 0, sy = 0, dx = 0, dy = 0, down = false;
    c.addEventListener('pointerdown', e=>{
      if(!c.classList.contains('top')) return;
      down = true; sx = e.clientX; sy = e.clientY; dx = dy = 0; c.classList.add('drag'); c.setPointerCapture(e.pointerId);
    });
    c.addEventListener('pointermove', e=>{
      if(!down) return;
      dx = e.clientX - sx; dy = (e.clientY - sy)*.3;
      c.style.transform = `translate(${dx}px,${dy}px) rotate(${dx*.06}deg)`;
    });
    c.addEventListener('pointerup', ()=>{
      if(!down) return; down = false; c.classList.remove('drag');
      if(Math.abs(dx) > 80 || Math.abs(dx) < 6) fling(c, dx < 0 ? -1 : 1);
      else layout();
    });
    c.addEventListener('pointercancel', ()=>{ if(!down) return; down = false; c.classList.remove('drag'); layout(); });
  }
  function fling(c, d){
    c.classList.remove('top');
    c.style.transform = `translate(${d*560}px,-60px) rotate(${d*32}deg)`; c.style.opacity = 0;
    const r = c.getBoundingClientRect();
    FX.burst(r.left + r.width/2, r.top + r.height/2, 12, 'white', 2);
    i++;
    if(i >= cards.length) setTimeout(onDone, 380); else layout();
  }
  return {
    enter(){
      cards.forEach((c,k)=>{
        c.style.transition = 'none';
        c.style.transform = `translateY(75vh) scale(.55) rotate(${(k%2 ? 1 : -1)*24}deg)`;
        c.style.opacity = 0;
      });
      void el.offsetWidth;
      cards.forEach((c,k)=>{ c.style.transition = ''; c.style.transitionDelay = (.45 + (cards.length - k)*.09) + 's'; });
      layout();
      setTimeout(()=>cards.forEach(c=>c.style.transitionDelay = ''), 2000);
    }
  };
}

const overlaps = (a, b) => a.l < b.r && a.r > b.l && a.t < b.b && a.b > b.t;
const grow = (r, p) => ({ l:r.left - p, r:r.right + p, t:r.top - p, b:r.bottom + p });
function placeNo(){
  const col = $('#askScene').getBoundingClientRect();
  const bw = no.offsetWidth, bh = no.offsetHeight;
  const k = parseFloat(yes.style.getPropertyValue('--k')) || 1;
  // «Да» растёт — считаем его будущий размер (+ запас на следующий шаг) и держимся подальше
  const yr = yes.getBoundingClientRect(), ycx = yr.left + yr.width/2, ycy = yr.top + yr.height/2;
  const yw = yes.offsetWidth*(k + .2), yh = yes.offsetHeight*(k + .2), pad = 44;
  const avoid = [
    { l:ycx - yw/2 - pad, r:ycx + yw/2 + pad, t:ycy - yh/2 - pad, b:ycy + yh/2 + pad },
    grow($('#question').getBoundingClientRect(), 10),
    grow($('#askScene .orb').getBoundingClientRect(), 30),
    grow($('#mute').getBoundingClientRect(), 12)
  ];
  const nr = no.getBoundingClientRect(), ncx = nr.left + nr.width/2, ncy = nr.top + nr.height/2;
  const minX = col.left + 14, maxX = col.right - bw - 14, minY = 70, maxY = innerHeight - bh - 44;
  let best = null, bestScore = -1;
  for(let n = 0; n < 120; n++){
    const x = minX + Math.random()*(maxX - minX), y = minY + Math.random()*(maxY - minY);
    if(avoid.some(a => overlaps({ l:x, r:x + bw, t:y, b:y + bh }, a))) continue;
    const cx = x + bw/2, cy = y + bh/2;
    const score = Math.min(Math.hypot(cx - ycx, cy - ycy), 280) + Math.min(Math.hypot(cx - ncx, cy - ncy), 320)*.6 + Math.random()*30;
    if(score > bestScore){ bestScore = score; best = { x, y }; }
  }
  if(!best) best = { x:minX, y: ycy < innerHeight/2 ? maxY : minY };
  no.style.left = best.x + 'px'; no.style.top = best.y + 'px';
  setTimeout(()=>FX.burst(best.x + bw/2, best.y + bh/2, 10, 'ice', 1.8), 260);
}
function dodge(e){
  e.preventDefault(); e.stopPropagation();
  lastDodge = performance.now();
  tries++;
  no.textContent = CONFIG.noTexts[Math.min(tries, CONFIG.noTexts.length-1)];

  }
  placeNo();
}

/* ---------- Система частиц ---------- */
const FX = (()=>{
  const c = $('#fx'), x = c.getContext('2d');
  let r = 1, parts = [], running = false;
  function size(){ r = Math.min(devicePixelRatio || 1, 2); c.width = innerWidth*r; c.height = innerHeight*r; }
  addEventListener('resize', size); size();
  const pick = kind => kind === 'mix' ? (Math.random() < .55 ? 'gold' : Math.random() < .5 ? 'ice' : 'white') : kind;
  function add(p){ parts.push(p); if(!running){ running = true; requestAnimationFrame(loop); } }
  function loop(){
    x.clearRect(0,0,c.width,c.height);
    x.textAlign = 'center'; x.textBaseline = 'middle';
    for(const p of parts){
      p.life++; p.x += p.vx; p.y += p.vy; p.vx *= p.drag; p.vy = p.vy*p.drag + p.g;
      const a = Math.max(0, 1 - p.life/p.max) * (p.fadeIn ? Math.min(1, p.life/20) : 1);
      x.globalAlpha = a;
      if(p.heart){
        x.fillStyle = '#f3d9a4'; x.font = `${p.s*6}px serif`; x.fillText('♥', p.x*r, p.y*r);
      } else {
        const sz = p.s*r*5*(0.8 + 0.2*Math.sin(p.life*.3));
        x.drawImage(SPR[p.c], p.x*r - sz/2, p.y*r - sz/2, sz, sz);
      }
    }
    parts = parts.filter(p => p.life < p.max);
    x.globalAlpha = 1;
    if(parts.length) requestAnimationFrame(loop); else { running = false; x.clearRect(0,0,c.width,c.height); }
  }
  return {
    burst(cx, cy, n, kind, speed, hearts){
      for(let i=0;i<n;i++){
        const a = Math.random()*Math.PI*2, v = (Math.random()*.8 + .2)*speed;
        add({ x:cx, y:cy, vx:Math.cos(a)*v, vy:Math.sin(a)*v, drag:.96, g:.02, life:0, max:50 + Math.random()*70,
              s:Math.random()*2 + 1.2, c:pick(kind), heart: hearts && Math.random() < .14 });
      }
    },
    // вспышка в форме сердца
    heartBurst(cx, cy){
      const n = 90;
      for(let i=0;i<n;i++){
        const t = i/n*Math.PI*2, hx = 16*Math.pow(Math.sin(t),3), hy = -(13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t));
        const sp = 6.5 + Math.random()*.4;
        add({ x:cx, y:cy, vx:hx/16*sp, vy:hy/16*sp, drag:.94, g:0, life:0, max:95 + Math.random()*25,
              s:1.8 + Math.random()*.8, c: i%3 ? 'gold' : 'white' });
      }
    },
    trail(px, py){
      add({ x:px + (Math.random()-.5)*8, y:py + (Math.random()-.5)*8, vx:(Math.random()-.5)*.6, vy:-Math.random()*.6, drag:.97, g:0,
            life:0, max:40 + Math.random()*30, s:Math.random()*1.4 + .8, c:Math.random() < .5 ? 'gold' : 'white' });
    },
    rise(){
      add({ x:Math.random()*innerWidth, y:innerHeight + 10, vx:(Math.random()-.5)*.3, vy:-(Math.random()*.8 + .5), drag:1, g:0,
            life:0, max:300 + Math.random()*200, s:Math.random()*1.6 + .8, c:Math.random() < .6 ? 'gold' : 'ice',
            heart: Math.random() < .12, fadeIn:true });
    }
  };
})();

/* ---------- Глубокий космос (фон) ---------- */
const Sky = (()=>{
  const c = $('#sky'), x = c.getContext('2d'), root = document.documentElement.style;
  let W, H, r, neb, stars = [], shoot = null, zoom = 1, zt = 1, t = 0, warp = 0, wt = 0;
  let lx = 0, ly = 0, ltx = 0, lty = 0, ripples = [], lastRipple = 0, prevB = 0, heart = null;
  const gauss = () => (Math.random()+Math.random()+Math.random()-1.5)/1.5;
  const blob = rgb => { const s = document.createElement('canvas'); s.width = s.height = 128;
    const g = s.getContext('2d'), gr = g.createRadialGradient(64,64,0,64,64,64);
    gr.addColorStop(0,`rgba(${rgb},1)`); gr.addColorStop(.5,`rgba(${rgb},.35)`); gr.addColorStop(1,`rgba(${rgb},0)`);
    g.fillStyle = gr; g.fillRect(0,0,128,128); return s; };
  // медленные полярные сияния, которые дышат вместе с музыкой
  const aurora = [
    { s:blob('40,150,170'), a:.10, px:.25, py:.3, ax:.25, ay:.15, sp:.00021, ph:0, sz:1.1 },
    { s:blob('110,60,190'), a:.10, px:.75, py:.65, ax:.2, ay:.2, sp:.00017, ph:2, sz:1.2 },
    { s:blob('60,90,210'),  a:.08, px:.5, py:.15, ax:.3, ay:.1, sp:.00013, ph:4, sz:1.3 }
  ];

  function build(){
    neb = document.createElement('canvas'); neb.width = W; neb.height = H;
    const n = neb.getContext('2d'), M = Math.max(W,H);
    n.fillStyle = '#03040a'; n.fillRect(0,0,W,H);
    n.globalCompositeOperation = 'lighter';
    const clouds = [
      [.15,.2,.4,'36,64,150',.14], [.9,.1,.32,'88,42,138',.12], [.78,.74,.4,'18,96,130',.11],
      [.22,.9,.34,'92,40,110',.09], [.55,.5,.22,'190,140,100',.035]
    ];
    for(const [bx,by,br,col,a] of clouds){
      for(let i=0;i<6;i++){
        const px = (bx + gauss()*.15)*W, py = (by + gauss()*.15)*H, rad = br*M*(.3 + Math.random()*.6);
        const g = n.createRadialGradient(px,py,0,px,py,rad);
        g.addColorStop(0,`rgba(${col},${a*.55})`); g.addColorStop(1,`rgba(${col},0)`);
        n.fillStyle = g; n.fillRect(0,0,W,H);
      }
    }
    for(let i=0;i<26;i++){
      const u = i/25, px = u*W + gauss()*W*.05, py = (.92 - .84*u)*H + gauss()*H*.05, rad = M*(.12 + Math.random()*.1);
      const g = n.createRadialGradient(px,py,0,px,py,rad);
      g.addColorStop(0,'rgba(200,210,255,.03)'); g.addColorStop(1,'rgba(200,210,255,0)');
      n.fillStyle = g; n.fillRect(0,0,W,H);
    }
    n.globalCompositeOperation = 'source-over';
    const dust = Math.round(W*H/(700*r*r));
    for(let i=0;i<dust;i++){
      const u = Math.random(), off = gauss()*.11;
      n.fillStyle = `rgba(255,255,255,${Math.random()*.3})`;
      n.fillRect(u*W + off*W*.6, (.92 - .84*u)*H + off*H, r*.7, r*.7);
    }
    for(let i=0;i<14;i++){
      const u = .1 + Math.random()*.8, px = u*W + gauss()*W*.03, py = (.92 - .84*u)*H + gauss()*H*.03, rad = M*(.03 + Math.random()*.05);
      const g = n.createRadialGradient(px,py,0,px,py,rad);
      g.addColorStop(0,'rgba(3,4,10,.5)'); g.addColorStop(1,'rgba(3,4,10,0)');
      n.fillStyle = g; n.fillRect(0,0,W,H);
    }
    stars = Array.from({length:Math.round(innerWidth*innerHeight/1600)}, ()=>{
      const k = Math.random();
      return { x:Math.random()*W, y:Math.random()*H, s:(Math.pow(Math.random(),4)*3 + .5)*r,
               p:Math.random()*6.28, v:Math.random()*.025 + .004, z:Math.random()*.8 + .2,
               c: k < .18 ? 'ice' : k < .3 ? 'warm' : 'white' };
    });
  }
  function size(){ r = Math.min(devicePixelRatio || 1, 2); W = c.width = innerWidth*r; H = c.height = innerHeight*r; build(); }
  addEventListener('resize', size); size();

  const heartXY = t => [16*Math.pow(Math.sin(t),3), -(13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t))];
  const ease = q => q < .5 ? 4*q*q*q : 1 - Math.pow(-2*q + 2, 3)/2;
  const OUT = 72;
  function drawHeart(now, P){
    const rc = heart.el.getBoundingClientRect();
    const ax = (rc.left + rc.width/2)*r, ay = (rc.top + rc.height/2)*r;
    const sc = Math.min(innerWidth*.88, 360)/34*r*(1 + P.b*.035);
    const el = now - heart.t0;
    const pos = heart.pts.map(p=>{
      const q = ease(Math.min(1, Math.max(0, (el - p.d)/1900)));
      const tx = ax + p.hx*sc, ty = ay + (p.hy - 3.2)*sc;
      return { x:p.sx + (tx - p.sx)*q, y:p.sy + (ty - p.sy)*q, q };
    });
    const la = Math.min(1, Math.max(0, (el - OUT*26 - 1500)/1800));
    if(la > 0){
      x.globalAlpha = la*(.22 + .25*P.e + .2*P.b); x.strokeStyle = '#f3d9a4'; x.lineWidth = r*.8;
      x.beginPath(); for(let i=0;i<OUT;i++){ const p = pos[i]; i ? x.lineTo(p.x, p.y) : x.moveTo(p.x, p.y); } x.closePath(); x.stroke();
    }
    heart.pts.forEach((p,i)=>{
      const q = pos[i], tw = .65 + .35*Math.sin(t*.05 + p.ph);
      const sz = p.sz*r*6*(1 + P.b*.6)*(.8 + .2*tw);
      x.globalAlpha = (.2 + .8*q.q)*(.55 + .45*tw);
      x.drawImage(SPR[p.c], q.x - sz/2, q.y - sz/2, sz, sz);
    });
  }

  let last = performance.now();
  (function loop(now){
    now = now || performance.now();
    const k = Math.min(4, (now - last)/16.7); last = now;
    t += k;
    const P = Music.sample(k);
    root.setProperty('--e', P.e.toFixed(3)); root.setProperty('--lo', P.lo.toFixed(3)); root.setProperty('--b', P.b.toFixed(3));

    wt *= Math.pow(.955, k); warp += (wt - warp)*(1 - Math.pow(.88, k));
    zoom += (zt - zoom)*(1 - Math.pow(.975, k));
    ltx *= Math.pow(.995, k); lty *= Math.pow(.995, k);
    lx += (ltx - lx)*(1 - Math.pow(.94, k)); ly += (lty - ly)*(1 - Math.pow(.94, k));
    const zr = zoom + P.b*.012 + P.lo*.008;
    const cx = W/2, cy = H/2, drift = Math.sin(t/900)*W*.01;
    const nz = 1 + (zr-1)*.35 + .04 + warp*.05;
    x.globalAlpha = 1; x.globalCompositeOperation = 'source-over';
    x.drawImage(neb, cx - cx*nz + drift - lx*6*r, cy - cy*nz - ly*6*r, W*nz, H*nz);

    // полярные сияния
    x.globalCompositeOperation = 'lighter';
    const M = Math.max(W,H);
    for(const a of aurora){
      const ph = now*a.sp + a.ph, sz = M*a.sz*(1 + .08*Math.sin(ph*1.7));
      const px = (a.px + a.ax*Math.sin(ph))*W, py = (a.py + a.ay*Math.cos(ph*1.3))*H;
      x.globalAlpha = Math.min(1, a.a*(.5 + 1.1*P.e + .6*P.b));
      x.drawImage(a.s, px - sz/2, py - sz/2, sz, sz);
    }
    x.globalCompositeOperation = 'source-over';

    const streak = warp > .03;
    if(streak){ x.lineCap = 'round'; }
    const glow = .75 + .45*P.e;
    for(const s of stars){
      s.p += s.v*k;
      const f = 1 + (zr-1)*s.z*1.6;
      const px = cx + (s.x - cx)*f + drift*s.z - lx*22*r*s.z, py = cy + (s.y - cy)*f - ly*22*r*s.z;
      if(px < -40 || px > W+40 || py < -40 || py > H+40) continue;
      const tw = .55 + .45*Math.sin(s.p);
      if(streak){
        const kk = warp*s.z*.45;
        x.globalAlpha = Math.min(1, .3 + warp*.8)*s.z;
        x.strokeStyle = s.c === 'ice' ? '#bcd9ff' : s.c === 'warm' ? '#ffe2c0' : '#fff';
        x.lineWidth = Math.max(.6*r, s.s*.7);
        x.beginPath(); x.moveTo(px, py); x.lineTo(px + (px-cx)*kk, py + (py-cy)*kk); x.stroke();
      } else {
        const sz = s.s*6*(.85 + .15*tw)*(1 + P.b*.25*s.z);
        x.globalAlpha = Math.min(1, (.35 + .65*tw*s.z)*glow);
        x.drawImage(SPR[s.c], px - sz/2, py - sz/2, sz, sz);
        if(s.s > 2.4*r){
          x.globalAlpha *= .35 + P.b*.3; x.strokeStyle = '#fff'; x.lineWidth = r*.6;
          const L = s.s*5*tw*(1 + P.b*.4);
          x.beginPath(); x.moveTo(px-L,py); x.lineTo(px+L,py); x.moveTo(px,py-L); x.lineTo(px,py+L); x.stroke();
        }
      }
    }

    // мягкие кольца-волны на сильных долях
    if(P.live && P.b > .85 && prevB < .8 && now - lastRipple > 900){
      lastRipple = now;
      let ox = cx, oy = cy;
      if(heart){ const rc = heart.el.getBoundingClientRect(); ox = (rc.left + rc.width/2)*r; oy = (rc.top + rc.height/2)*r; }
      ripples.push({ x:ox, y:oy, rad:20*r, a:.22 });
    }
    prevB = P.b;
    for(const rp of ripples){
      rp.rad += 7*r*k; rp.a *= Math.pow(.972, k);
      x.globalAlpha = rp.a; x.strokeStyle = '#f3d9a4'; x.lineWidth = 1.2*r;
      x.beginPath(); x.arc(rp.x, rp.y, rp.rad, 0, Math.PI*2); x.stroke();
    }
    ripples = ripples.filter(rp => rp.a > .01);

    if(heart) drawHeart(now, P);

    x.globalAlpha = 1;
    if(!shoot && Math.random() < .004 + P.b*.012) shoot = { x:Math.random()*W*.7, y:Math.random()*H*.4, l:0, a:.4 + Math.random()*.3, gold: Math.random() < .35 };
    if(shoot){
      const sp = 16*r*k; shoot.x += sp*Math.cos(shoot.a); shoot.y += sp*Math.sin(shoot.a); shoot.l += k;
      const tx = shoot.x - Math.cos(shoot.a)*140*r, ty = shoot.y - Math.sin(shoot.a)*140*r;
      const fade = Math.sin(Math.min(1, shoot.l/45)*Math.PI);
      const g = x.createLinearGradient(shoot.x,shoot.y,tx,ty);
      g.addColorStop(0, shoot.gold ? `rgba(255,236,200,${.9*fade})` : `rgba(255,255,255,${.9*fade})`); g.addColorStop(1,'rgba(255,255,255,0)');
      x.strokeStyle = g; x.lineWidth = 1.4*r;
      x.beginPath(); x.moveTo(shoot.x,shoot.y); x.lineTo(tx,ty); x.stroke();
      if(shoot.l > 45) shoot = null;
    }
    requestAnimationFrame(loop);
  })();

  return {
    warp(p = 1){ wt = p; zt += .22; },
    look(px, py){ ltx = px/innerWidth - .5; lty = py/innerHeight - .5; },
    heart(el){
      const list = [];
      for(let i=0;i<OUT;i++){ const [hx,hy] = heartXY(i/OUT*Math.PI*2); list.push({ hx, hy, d:i*26, sz:1.5 + Math.random()*.7 }); }
      for(let i=0;i<44;i++){
        const [hx,hy] = heartXY(Math.random()*Math.PI*2), q = Math.sqrt(Math.random())*.82;
        list.push({ hx:hx*q, hy:2.5 + (hy - 2.5)*q, d:500 + Math.random()*2200, sz:.9 + Math.random()*.7 });
      }
      list.forEach(p=>{
        const s = stars[Math.random()*stars.length|0];
        p.sx = s.x; p.sy = s.y; p.ph = Math.random()*6.28;
        p.c = Math.random() < .62 ? 'gold' : Math.random() < .5 ? 'white' : 'ice';
      });
      heart = { pts:list, t0:performance.now(), el };
    }
  };
})();
</script>
</body>
