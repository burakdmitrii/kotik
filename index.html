<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Для тебя">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#03040a">
<title>Для тебя</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="preload" href="img/1.jpg" as="image">
<style>
  :root{
    --bg:#03040a; --ink:#eef1f8; --muted:rgba(238,241,248,.62);
    --gold:#f3d9a4; --ice:#a9d4ff;
    --glass:rgba(255,255,255,.055); --line:rgba(255,255,255,.14);
    --serif:'Cormorant Garamond',Georgia,serif; --sans:'Manrope',-apple-system,system-ui,sans-serif;
    --ease:cubic-bezier(.2,.8,.2,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{position:fixed;width:100%;height:100%}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);overscroll-behavior:none;
    font-family:var(--sans);touch-action:manipulation;-webkit-text-size-adjust:100%;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  body{height:100vh;height:100dvh}
  button{font-family:inherit;-webkit-appearance:none;appearance:none;cursor:pointer}
  img{-webkit-user-drag:none;pointer-events:none}
  #sky{position:fixed;inset:0;width:100%;height:100%;z-index:0}
  #fx{position:fixed;inset:0;width:100%;height:100%;z-index:20;pointer-events:none}

  /* ---------- сцены и переходы ---------- */
  .scene{position:fixed;inset:0;max-width:430px;margin:0 auto;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:max(28px,env(safe-area-inset-top)) 24px max(28px,env(safe-area-inset-bottom));text-align:center;
    opacity:0;visibility:hidden;pointer-events:none;transition:opacity .9s ease,visibility 0s .9s,transform .9s var(--ease),filter .9s}
  .scene.active{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .9s ease .25s,visibility 0s}
  .scene.leave{transform:scale(1.15);filter:blur(10px)}
  .scene>*{opacity:0;transform:translateY(26px) scale(.98);filter:blur(6px);
    transition:opacity .9s ease,transform 1s var(--ease),filter .9s ease}
  .scene.active>*{opacity:1;transform:none;filter:none;transition-delay:calc(.35s + var(--i,0)*.14s)}
  .pop{animation:pop .7s var(--ease) both}
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.92);filter:blur(4px)}}

  h1,h2{font-family:var(--serif);font-weight:500;margin:0;letter-spacing:.01em}
  h1{font-size:clamp(44px,12.5vw,60px);line-height:1.02}
  h2{font-size:clamp(34px,10vw,44px);line-height:1.08}
  .eyebrow{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--muted);margin:0 0 16px}
  .sub{font-weight:300;font-size:15px;color:var(--muted);margin:16px 0 0;line-height:1.6;max-width:300px}
  .btn{position:relative;overflow:hidden;margin-top:34px;border:1px solid rgba(255,255,255,.55);border-radius:999px;padding:15px 38px;
    font:600 12px var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--ink);
    background:rgba(255,255,255,.04);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    box-shadow:0 0 24px rgba(169,212,255,.15),inset 0 0 12px rgba(255,255,255,.05);transition:transform .2s,background .3s}
  .btn::after{content:'';position:absolute;top:0;bottom:0;width:40%;left:-60%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);animation:shine 3.6s ease-in-out infinite 1.5s}
  @keyframes shine{0%{left:-60%}35%,100%{left:130%}}
  .btn:active{transform:scale(.95);background:rgba(255,255,255,.12)}
  .btn.ghost{border-color:var(--line);box-shadow:none;color:var(--muted)}
  .btn.ghost::after{display:none}
  .hidden{display:none!important}

  /* ---------- интро ---------- */
  .planet{position:relative;width:132px;height:132px;margin-bottom:46px}
  .planet .body{position:absolute;inset:0;border-radius:50%;z-index:2;animation:float 7s ease-in-out infinite;
    background:radial-gradient(circle at 32% 28%,#e9f2ff 0%,#8fb2ee 10%,#3d5cb4 30%,#16205a 58%,#05071a 80%);
    box-shadow:0 0 60px rgba(120,170,255,.35),0 0 140px rgba(90,110,220,.18),inset -18px -22px 40px rgba(0,0,0,.75)}
  .planet .body::before,.planet .body::after{content:'';position:absolute;left:-46%;right:-46%;top:41%;height:18%;border-radius:50%;
    border:1.5px solid rgba(243,217,164,.6);transform:rotate(-14deg);box-shadow:0 0 18px rgba(243,217,164,.25);z-index:-1}
  .planet .body::after{z-index:3;clip-path:inset(50% 0 0 0)}
  .planet .halo{position:absolute;inset:-30px;border-radius:50%;background:radial-gradient(circle,rgba(120,170,255,.25),transparent 65%);animation:halo 5s ease-in-out infinite}
  @keyframes halo{50%{transform:scale(1.15);opacity:.6}}
  @keyframes float{50%{transform:translateY(-10px)}}
  .moon{position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%,#fff,#b9c2d6 45%,#3a4058 100%);box-shadow:0 0 10px rgba(255,255,255,.45)}
  .title-chars .w{display:inline-block;white-space:nowrap}
  .title-chars .c{display:inline-block;opacity:0;transform:translateY(.4em) rotate(8deg);filter:blur(8px)}
  .scene.active .title-chars .c{animation:charIn 1s var(--ease) forwards;animation-delay:calc(.7s + var(--n)*.06s)}
  @keyframes charIn{to{opacity:1;transform:none;filter:none}}

  /* ---------- викторина ---------- */
  .qdots{display:flex;gap:6px;margin-bottom:24px}
  .qdots i{width:22px;height:2px;border-radius:1px;background:rgba(255,255,255,.18);transition:background .5s,box-shadow .5s}
  .qdots i.on{background:var(--gold);box-shadow:0 0 8px var(--gold)}
  #qbox{width:100%;display:flex;flex-direction:column;align-items:center;transition:opacity .45s,transform .45s var(--ease),filter .45s}
  #qbox.swap{opacity:0;transform:translateX(-40px);filter:blur(6px)}
  .qtext{max-width:340px;min-height:2.2em;display:flex;align-items:center}
  .opts{display:flex;flex-direction:column;gap:9px;width:min(340px,100%);margin-top:22px}
  .opt{border:1px solid var(--line);border-radius:16px;padding:14px 18px;font:400 15px/1.35 var(--sans);color:var(--ink);
    background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);text-align:left;
    transition:transform .15s,background .3s,border-color .3s,box-shadow .3s,opacity .4s}
  .scene.active .opt{animation:optIn .6s var(--ease) both;animation-delay:calc(var(--n)*.07s + .1s)}
  @keyframes optIn{from{opacity:0;transform:translateX(30px);filter:blur(4px)}}
  .opt:active{transform:scale(.98)}
  .opt.ok{border-color:rgba(243,217,164,.85);background:rgba(243,217,164,.13);box-shadow:0 0 26px rgba(243,217,164,.3)}
  .opt.dim{opacity:.35}
  .opt.bad{border-color:rgba(255,120,120,.6);animation:shake .45s!important}
  @keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
  .qmsg{min-height:44px;margin:16px 0 0;font-weight:300;font-size:14px;line-height:1.55;color:var(--muted);max-width:320px;opacity:0;transition:opacity .4s}
  .qmsg.show{opacity:1}
  #qnext{margin-top:12px}

  /* ---------- созвездие ---------- */
  #field{position:relative;width:100%;max-width:380px;height:48vh;height:48dvh;margin-top:16px}
  #clines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  #clines polyline{fill:none;stroke:rgba(243,217,164,.75);stroke-width:1;stroke-linejoin:round;
    filter:drop-shadow(0 0 4px rgba(243,217,164,.8));stroke-dasharray:1600;stroke-dashoffset:1600;transition:stroke-dashoffset 3.2s ease}
  #clines.draw polyline{stroke-dashoffset:0}
  .cstar{position:absolute;width:52px;height:52px;margin:-26px 0 0 -26px;border:0;background:none;padding:0;opacity:0}
  .scene.active .cstar{animation:starIn 1.1s var(--ease) both;animation-delay:calc(.9s + var(--n)*.28s)}
  @keyframes starIn{from{opacity:0;transform:scale(0) rotate(-90deg)}to{opacity:1;transform:none}}
  .cstar::before{content:'';position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3.5px;border-radius:50%;background:#fff;
    box-shadow:0 0 6px 2px #fff,0 0 20px 6px rgba(169,212,255,.55);transition:box-shadow .6s,transform .6s}
  .cstar::after{content:'';position:absolute;inset:6px;border-radius:50%;border:1px solid rgba(255,255,255,.5);animation:ping 2.4s ease-out infinite}
  .cstar:nth-of-type(2n)::after{animation-delay:.8s}
  .cstar:nth-of-type(3n)::after{animation-delay:1.6s}
  @keyframes ping{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1.25);opacity:0}}
  .cstar.seen::after{display:none}
  .cstar.seen::before{background:#fff8e8;transform:scale(1.2);box-shadow:0 0 8px 3px #fff8e8,0 0 28px 10px rgba(243,217,164,.55)}
  #field.done .cstar::before{animation:glow 2.6s ease-in-out infinite}
  @keyframes glow{50%{box-shadow:0 0 12px 5px #fff8e8,0 0 44px 18px rgba(243,217,164,.7)}}
  .cstar .lbl{position:absolute;top:44px;left:50%;transform:translateX(-50%) translateY(6px);white-space:nowrap;font-size:10px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--gold);opacity:0;transition:opacity .8s,transform .8s}
  .cstar.seen .lbl{opacity:.85;transform:translateX(-50%)}
  .progress{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);margin:12px 0 0;min-height:16px}

  .modal{position:fixed;inset:0;max-width:430px;margin:0 auto;z-index:15;display:flex;align-items:center;justify-content:center;padding:24px;
    background:rgba(2,3,10,.6);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:opacity .45s}
  .modal.open{opacity:1;pointer-events:auto}
  .mcard{width:min(340px,100%);background:linear-gradient(170deg,rgba(255,255,255,.1),rgba(255,255,255,.03));
    border:1px solid var(--line);border-radius:24px;padding:30px 26px 26px;text-align:center;
    transform:translateY(30px) scale(.9) rotateX(20deg);opacity:0;transition:transform .6s var(--ease),opacity .5s}
  .modal.open .mcard{transform:none;opacity:1}
  .mcard h3{font:500 32px/1.1 var(--serif);margin:0 0 12px;color:var(--gold)}
  .mcard p{font-weight:300;font-size:15px;line-height:1.65;margin:0;color:rgba(238,241,248,.85)}
  .mcard .btn{margin-top:24px;padding:12px 28px}

  /* ---------- колоды карточек ---------- */
  .deck{position:relative;width:min(300px,80vw);height:min(400px,52vh);height:min(400px,52dvh);margin-top:26px}
  .card{position:absolute;inset:0;border-radius:24px;touch-action:none;will-change:transform;
    transition:transform .65s var(--ease),opacity .5s,filter .5s}
  .card.drag{transition:none}
  .rcard{padding:30px 26px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;
    background:linear-gradient(165deg,#1b2045,#080a1a);border:1px solid #2a2f4a;
    box-shadow:0 24px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.08)}
  .rcard::before{content:'';position:absolute;width:240px;height:240px;right:-100px;top:-100px;border-radius:50%;
    background:radial-gradient(circle,rgba(169,212,255,.2),transparent 70%)}
  .rcard::after{content:'';position:absolute;width:200px;height:200px;left:-90px;bottom:-90px;border-radius:50%;
    background:radial-gradient(circle,rgba(243,217,164,.12),transparent 70%)}
  .rcard .n{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-bottom:18px}
  .rcard .t{font:italic 500 clamp(26px,7.4vw,31px)/1.25 var(--serif);position:relative;z-index:1}
  .pcard{background:#0b0e20;border:1px solid #262b45;padding:10px 10px 0;box-shadow:0 24px 60px rgba(0,0,0,.65);display:flex;flex-direction:column}
  .pcard .ph{flex:1;border-radius:16px;overflow:hidden;position:relative}
  .pcard .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .pcard.top .ph img{animation:kb 9s ease-in-out infinite alternate}
  @keyframes kb{from{transform:scale(1)}to{transform:scale(1.09) translate(-1.5%,-1.5%)}}
  .pcard .ph::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(5,7,20,.45))}
  .pcard .cap{font:italic 500 21px/1.2 var(--serif);color:var(--ink);padding:14px 8px 16px;text-align:center}
  .hint{margin:20px 0 0;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
  .hint span{display:inline-block;animation:nudge 1.6s ease-in-out infinite}
  @keyframes nudge{50%{transform:translateX(6px)}}

  /* ---------- вопрос ---------- */
  .answer{display:flex;flex-direction:column;align-items:center}
  .orb{width:16px;height:16px;border-radius:50%;background:#fff;margin-bottom:50px;
    box-shadow:0 0 10px 4px #fff,0 0 40px 14px rgba(243,217,164,.6),0 0 110px 40px rgba(169,212,255,.25);animation:pulse 3s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.25);box-shadow:0 0 14px 6px #fff,0 0 60px 20px rgba(243,217,164,.7),0 0 140px 60px rgba(169,212,255,.3)}}
  #yes{transform:scale(var(--k,1));transition:transform .35s var(--ease),background .3s}
  #no{margin-top:20px;padding:12px 26px}
  #no.run{position:fixed;z-index:6;margin:0;transition:left .3s var(--ease),top .3s var(--ease)}
  .flash{position:fixed;inset:0;z-index:19;pointer-events:none;background:radial-gradient(circle,rgba(255,250,235,.95),rgba(255,250,235,0) 65%);
    animation:flash 1.4s ease-out forwards}
  @keyframes flash{from{opacity:1}to{opacity:0}}
  .nova{position:fixed;left:50%;top:50%;width:10px;height:10px;margin:-5px;border-radius:50%;z-index:19;pointer-events:none;
    border:2px solid rgba(255,248,232,.9);box-shadow:0 0 30px rgba(243,217,164,.8),inset 0 0 30px rgba(243,217,164,.5);
    animation:nova 1.8s ease-out forwards}
  .nova.n2{animation-delay:.18s;border-color:rgba(169,212,255,.8)}
  @keyframes nova{to{transform:scale(150);opacity:0}}

  /* ---------- письмо ---------- */
  .scene.scroll{justify-content:flex-start;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;
    padding-top:max(64px,calc(env(safe-area-inset-top) + 40px));padding-bottom:max(60px,env(safe-area-inset-bottom))}
  .avatar{position:relative;width:150px;height:150px;margin-bottom:34px;flex:none}
  .avatar img{position:absolute;inset:14px;width:calc(100% - 28px);height:calc(100% - 28px);border-radius:50%;object-fit:cover;
    box-shadow:0 0 0 1px rgba(243,217,164,.6),0 0 40px rgba(243,217,164,.35),0 0 90px rgba(169,212,255,.25)}
  .avatar .ring{position:absolute;inset:0;border-radius:50%;border:1px dashed rgba(243,217,164,.45);animation:spin 18s linear infinite}
  .avatar .ring::after{content:'';position:absolute;top:-4px;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:#fff8e8;
    box-shadow:0 0 10px 3px rgba(243,217,164,.8)}
  .avatar .ring2{position:absolute;inset:-14px;border-radius:50%;border:1px solid rgba(169,212,255,.15);animation:spin 30s linear infinite reverse}
  .avatar .ring2::after{content:'';position:absolute;bottom:-3px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--ice);
    box-shadow:0 0 8px 2px rgba(169,212,255,.8)}
  @keyframes spin{to{transform:rotate(360deg)}}
  #letterLines{display:flex;flex-direction:column;gap:18px;max-width:330px}
  .lline{font:italic 500 23px/1.35 var(--serif);margin:0;opacity:0;transform:translateY(18px);filter:blur(8px);
    transition:opacity 1.4s ease,transform 1.4s var(--ease),filter 1.4s ease}
  .lline.show{opacity:1;transform:none;filter:none}
  .lline.strong{font-style:normal;font-weight:600;color:#fff;text-shadow:0 0 24px rgba(243,217,164,.45)}
  .big{font-size:clamp(46px,13vw,62px);margin-top:36px;opacity:0;transform:scale(.8);filter:blur(10px);
    transition:opacity 1.6s ease,transform 1.8s var(--ease),filter 1.6s;
    background:linear-gradient(90deg,#fff 0%,var(--gold) 30%,#fff 50%,var(--gold) 70%,#fff 100%);background-size:200% auto;
    -webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 5s linear infinite}
  .scene.active>.big:not(.show){opacity:0;transform:scale(.8);filter:blur(10px)}
  .scene.active>.sign:not(.show),.scene.active>.again:not(.show){opacity:0}
  .big.show{opacity:1;transform:none;filter:drop-shadow(0 0 18px rgba(243,217,164,.45))}
  @keyframes sheen{to{background-position:-200% center}}
  .sign{font:italic 500 28px var(--serif);color:var(--gold);margin:26px 0 0;opacity:0;transition:opacity 1.6s}
  .sign.show{opacity:1}
  .again{margin-top:30px;opacity:0;transition:opacity 1.4s}
  .again.show{opacity:1}

  /* ---------- музыка ---------- */
  #mute{position:fixed;top:max(14px,env(safe-area-inset-top));right:14px;z-index:25;width:42px;height:42px;border-radius:50%;
    border:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    display:flex;align-items:flex-end;justify-content:center;gap:3px;padding:13px 0;opacity:0;transform:scale(.6);transition:opacity .6s,transform .6s var(--ease)}
  #mute.on{opacity:1;transform:none}
  #mute i{width:3px;height:100%;border-radius:2px;background:var(--gold);transform-origin:bottom;animation:eq 1s ease-in-out infinite}
  #mute i:nth-child(2){animation-delay:.25s}
  #mute i:nth-child(3){animation-delay:.5s}
  #mute.paused i{animation:none;transform:scaleY(.25);background:var(--muted)}
  @keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<button id="mute" aria-label="Музыка"><i></i><i></i><i></i></button>

<!-- 0. Intro -->
<section class="scene active">
  <div class="planet"><div class="halo"></div><div class="body"></div><div class="moon" id="moon"></div></div>
  <p class="eyebrow">Сообщение для тебя</p>
  <h1 class="title-chars" id="hello"></h1>
  <p class="sub">Я собрал для тебя маленькую вселенную.<br>Включи звук и не спеши.</p>
  <button class="btn" data-next>Открыть</button>
</section>

<!-- 1. Quiz -->
<section class="scene">
  <p class="eyebrow">Глава первая</p>
  <div class="qdots" id="qdots"></div>
  <div id="qbox">
    <h2 class="qtext" id="qtext"></h2>
    <div class="opts" id="opts"></div>
    <p class="qmsg" id="qmsg"></p>
    <button class="btn hidden" id="qnext">Дальше</button>
  </div>
</section>

<!-- 2. Constellation -->
<section class="scene">
  <p class="eyebrow">Глава вторая</p>
  <h2>Наше созвездие</h2>
  <p class="sub" style="margin-top:10px">Коснись каждой звезды</p>
  <div id="field"><svg id="clines"><polyline id="poly"/></svg></div>
  <p class="progress" id="prog"></p>
  <button class="btn hidden" id="starsNext" data-next>Дальше</button>
</section>

<!-- 3. Photos -->
<section class="scene">
  <p class="eyebrow">Глава третья</p>
  <h2>Моя вселенная</h2>
  <div class="deck" id="photoDeck"></div>
  <p class="hint">Свайп или тап <span>→</span></p>
</section>

<!-- 4. Reasons -->
<section class="scene">
  <p class="eyebrow">Глава четвёртая</p>
  <h2>Почему именно ты</h2>
  <div class="deck" id="reasonDeck"></div>
  <p class="hint">Свайп или тап <span>→</span></p>
</section>

<!-- 5. Question -->
<section class="scene" id="askScene">
  <div class="answer">
    <div class="orb"></div>
    <h1 id="question"></h1>
    <button class="btn" id="yes">Да</button>
    <button class="btn ghost" id="no">Нет</button>
  </div>
</section>

<!-- 6. Letter -->
<section class="scene scroll" id="letter">
  <div class="avatar"><span class="ring2"></span><span class="ring"></span><img id="avatarImg" alt=""></div>
  <p class="eyebrow">Последняя глава</p>
  <div id="letterLines"></div>
  <h1 class="big" id="love"></h1>
  <p class="sign" id="sign"></p>
  <button class="btn ghost again" id="again">Пройти ещё раз</button>
</section>

<div class="modal" id="modal"><div class="mcard" id="mcard"></div></div>
<canvas id="fx"></canvas>

<script>
/* ============================================================

/* ---------- glow sprite (общий для неба и эффектов) ---------- */
function makeSprite(rgb){
  const s = document.createElement('canvas'); s.width = s.height = 64;
  const g = s.getContext('2d'), gr = g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(.12,`rgba(${rgb},.9)`);
  gr.addColorStop(.35,`rgba(${rgb},.22)`); gr.addColorStop(1,`rgba(${rgb},0)`);
  g.fillStyle = gr; g.fillRect(0,0,64,64); return s;
}
const SPR = { white:makeSprite('255,255,255'), ice:makeSprite('170,205,255'), warm:makeSprite('255,214,170'), gold:makeSprite('243,217,164') };

const Music = (()=>{
  const btn = $('#mute');
  if(!CONFIG.music) return { start(){} };
  const a = new Audio(CONFIG.music); a.loop = true; a.preload = 'auto';
  let started = false, muted = false;
  function play(){ a.play().then(()=>btn.classList.remove('paused')).catch(()=>btn.classList.add('paused')); }
  btn.onclick = e => {
    e.stopPropagation();
    if(muted || a.paused){ muted = false; play(); }
    else { muted = true; a.pause(); btn.classList.add('paused'); }
  };
  // iOS ставит звук на паузу при сворачивании — возобновляем, когда она вернётся
  document.addEventListener('visibilitychange', ()=>{
    if(!started) return;
    if(document.hidden) a.pause(); else if(!muted) play();
  });
  a.addEventListener('pause', ()=>{ if(!muted && started && !document.hidden) setTimeout(play, 300); });
  return { start(){ if(started) return; started = true; btn.classList.add('on'); play(); } };
})();

/* ---------- Колоды карточек (фото и причины) ---------- */
function makeDeck(el, items, cls, render, onDone){
  let i = 0;
  const cards = items.map((item,k)=>{
    const c = document.createElement('div'); c.className = 'card ' + cls;
    render(c, item, k);
    attachSwipe(c);
    el.appendChild(c);
    return c;
  });
  function layout(){
    cards.forEach((c,k)=>{
      if(k < i) return;
      const d = k - i;
      c.style.zIndex = 100 - k;
      c.style.transform = `translateY(${d*14}px) scale(${1 - d*.05}) rotate(${d ? (k%2 ? 3 : -3) : 0}deg)`;
      c.style.opacity = d > 2 ? 0 : 1;
      c.style.filter = d ? `brightness(${1 - d*.25})` : '';
      c.classList.toggle('top', d === 0);
    });
  }
  function attachSwipe(c){
    let sx = 0, sy = 0, dx = 0, dy = 0, down = false;
    c.addEventListener('pointerdown', e=>{
      if(!c.classList.contains('top')) return;
      down = true; sx = e.clientX; sy = e.clientY; dx = dy = 0; c.classList.add('drag'); c.setPointerCapture(e.pointerId);
    });
    c.addEventListener('pointermove', e=>{
      if(!down) return;
      dx = e.clientX - sx; dy = (e.clientY - sy)*.3;
      c.style.transform = `translate(${dx}px,${dy}px) rotate(${dx*.06}deg)`;
    });
    c.addEventListener('pointerup', ()=>{
      if(!down) return; down = false; c.classList.remove('drag');
      if(Math.abs(dx) > 80 || Math.abs(dx) < 6) fling(c, dx < 0 ? -1 : 1);
      else layout();
    });
    c.addEventListener('pointercancel', ()=>{ if(!down) return; down = false; c.classList.remove('drag'); layout(); });
  }
  function fling(c, d){
    c.classList.remove('top');
    c.style.transform = `translate(${d*560}px,-60px) rotate(${d*32}deg)`; c.style.opacity = 0;
    const r = c.getBoundingClientRect();
    FX.burst(r.left + r.width/2, r.top + r.height/2, 12, 'white', 2);
    i++;
    if(i >= cards.length) setTimeout(onDone, 380); else layout();
  }
  return {
    enter(){
      cards.forEach((c,k)=>{
        c.style.transition = 'none';
        c.style.transform = `translateY(75vh) scale(.55) rotate(${(k%2 ? 1 : -1)*24}deg)`;
        c.style.opacity = 0;
      });
      void el.offsetWidth;
      cards.forEach((c,k)=>{ c.style.transition = ''; c.style.transitionDelay = (.45 + (cards.length - k)*.09) + 's'; });
      layout();
      setTimeout(()=>cards.forEach(c=>c.style.transitionDelay = ''), 2000);
    }
  };
}

/* ---------- Система частиц ---------- */
const FX = (()=>{
  const c = $('#fx'), x = c.getContext('2d');
  let r = 1, parts = [], running = false;
  function size(){ r = Math.min(devicePixelRatio || 1, 2); c.width = innerWidth*r; c.height = innerHeight*r; }
  addEventListener('resize', size); size();
  const pick = kind => kind === 'mix' ? (Math.random() < .55 ? 'gold' : Math.random() < .5 ? 'ice' : 'white') : kind;
  function add(p){ parts.push(p); if(!running){ running = true; requestAnimationFrame(loop); } }
  function loop(){
    x.clearRect(0,0,c.width,c.height);
    x.textAlign = 'center'; x.textBaseline = 'middle';
    for(const p of parts){
      p.life++; p.x += p.vx; p.y += p.vy; p.vx *= p.drag; p.vy = p.vy*p.drag + p.g;
      const a = Math.max(0, 1 - p.life/p.max) * (p.fadeIn ? Math.min(1, p.life/20) : 1);
      x.globalAlpha = a;
      if(p.heart){
        x.fillStyle = '#f3d9a4'; x.font = `${p.s*6}px serif`; x.fillText('♥', p.x*r, p.y*r);
      } else {
        const sz = p.s*r*5*(0.8 + 0.2*Math.sin(p.life*.3));
        x.drawImage(SPR[p.c], p.x*r - sz/2, p.y*r - sz/2, sz, sz);
      }
    }
    parts = parts.filter(p => p.life < p.max);
    x.globalAlpha = 1;
    if(parts.length) requestAnimationFrame(loop); else { running = false; x.clearRect(0,0,c.width,c.height); }
  }
  return {
    burst(cx, cy, n, kind, speed, hearts){
      for(let i=0;i<n;i++){
        const a = Math.random()*Math.PI*2, v = (Math.random()*.8 + .2)*speed;
        add({ x:cx, y:cy, vx:Math.cos(a)*v, vy:Math.sin(a)*v, drag:.96, g:.02, life:0, max:50 + Math.random()*70,
              s:Math.random()*2 + 1.2, c:pick(kind), heart: hearts && Math.random() < .14 });
      }
    },
    trail(px, py){
      add({ x:px + (Math.random()-.5)*8, y:py + (Math.random()-.5)*8, vx:(Math.random()-.5)*.6, vy:-Math.random()*.6, drag:.97, g:0,
            life:0, max:40 + Math.random()*30, s:Math.random()*1.4 + .8, c:Math.random() < .5 ? 'gold' : 'white' });
    },
    rise(){
      add({ x:Math.random()*innerWidth, y:innerHeight + 10, vx:(Math.random()-.5)*.3, vy:-(Math.random()*.8 + .5), drag:1, g:0,
            life:0, max:300 + Math.random()*200, s:Math.random()*1.6 + .8, c:Math.random() < .6 ? 'gold' : 'ice',
            heart: Math.random() < .12, fadeIn:true });
    }
  };
})();

/* ---------- Глубокий космос (фон) ---------- */
const Sky = (()=>{
  const c = $('#sky'), x = c.getContext('2d');
  let W, H, r, neb, stars = [], shoot = null, zoom = 1, zt = 1, t = 0, warp = 0, wt = 0;
  const gauss = () => (Math.random()+Math.random()+Math.random()-1.5)/1.5;

  function build(){
    neb = document.createElement('canvas'); neb.width = W; neb.height = H;
    const n = neb.getContext('2d'), M = Math.max(W,H);
    n.fillStyle = '#03040a'; n.fillRect(0,0,W,H);
    n.globalCompositeOperation = 'lighter';
    const clouds = [
      [.15,.2,.4,'36,64,150',.14], [.9,.1,.32,'88,42,138',.12], [.78,.74,.4,'18,96,130',.11],
      [.22,.9,.34,'92,40,110',.09], [.55,.5,.22,'190,140,100',.035]
    ];
    for(const [bx,by,br,col,a] of clouds){
      for(let i=0;i<6;i++){
        const px = (bx + gauss()*.15)*W, py = (by + gauss()*.15)*H, rad = br*M*(.3 + Math.random()*.6);
        const g = n.createRadialGradient(px,py,0,px,py,rad);
        g.addColorStop(0,`rgba(${col},${a*.55})`); g.addColorStop(1,`rgba(${col},0)`);
        n.fillStyle = g; n.fillRect(0,0,W,H);
      }
    }
    for(let i=0;i<26;i++){
      const u = i/25, px = u*W + gauss()*W*.05, py = (.92 - .84*u)*H + gauss()*H*.05, rad = M*(.12 + Math.random()*.1);
      const g = n.createRadialGradient(px,py,0,px,py,rad);
      g.addColorStop(0,'rgba(200,210,255,.03)'); g.addColorStop(1,'rgba(200,210,255,0)');
      n.fillStyle = g; n.fillRect(0,0,W,H);
    }
    n.globalCompositeOperation = 'source-over';
    const dust = Math.round(W*H/(700*r*r));
    for(let i=0;i<dust;i++){
      const u = Math.random(), off = gauss()*.11;
      n.fillStyle = `rgba(255,255,255,${Math.random()*.3})`;
      n.fillRect(u*W + off*W*.6, (.92 - .84*u)*H + off*H, r*.7, r*.7);
    }
    for(let i=0;i<14;i++){
      const u = .1 + Math.random()*.8, px = u*W + gauss()*W*.03, py = (.92 - .84*u)*H + gauss()*H*.03, rad = M*(.03 + Math.random()*.05);
      const g = n.createRadialGradient(px,py,0,px,py,rad);
      g.addColorStop(0,'rgba(3,4,10,.5)'); g.addColorStop(1,'rgba(3,4,10,0)');
      n.fillStyle = g; n.fillRect(0,0,W,H);
    }
    stars = Array.from({length:Math.round(innerWidth*innerHeight/1600)}, ()=>{
      const k = Math.random();
      return { x:Math.random()*W, y:Math.random()*H, s:(Math.pow(Math.random(),4)*3 + .5)*r,
               p:Math.random()*6.28, v:Math.random()*.025 + .004, z:Math.random()*.8 + .2,
               c: k < .18 ? 'ice' : k < .3 ? 'warm' : 'white' };
    });
  }
  function size(){ r = Math.min(devicePixelRatio || 1, 2); W = c.width = innerWidth*r; H = c.height = innerHeight*r; build(); }
  addEventListener('resize', size); size();

  let last = performance.now();
  (function loop(now){
    now = now || performance.now();
    const k = Math.min(4, (now - last)/16.7); last = now;
    t += k;
    wt *= Math.pow(.955, k); warp += (wt - warp)*(1 - Math.pow(.88, k));
    zoom += (zt - zoom)*(1 - Math.pow(.975, k));
    const cx = W/2, cy = H/2, drift = Math.sin(t/900)*W*.01;
    const nz = 1 + (zoom-1)*.35 + .04 + warp*.05;
    x.globalAlpha = 1;
    x.drawImage(neb, cx - cx*nz + drift, cy - cy*nz, W*nz, H*nz);
    const streak = warp > .03;
    if(streak){ x.lineCap = 'round'; }
    for(const s of stars){
      s.p += s.v*k;
      const f = 1 + (zoom-1)*s.z*1.6;
      const px = cx + (s.x - cx)*f + drift*s.z, py = cy + (s.y - cy)*f;
      if(px < -40 || px > W+40 || py < -40 || py > H+40) continue;
      const tw = .55 + .45*Math.sin(s.p);
      if(streak){
        const k = warp*s.z*.45;
        x.globalAlpha = Math.min(1, .3 + warp*.8)*s.z;
        x.strokeStyle = s.c === 'ice' ? '#bcd9ff' : s.c === 'warm' ? '#ffe2c0' : '#fff';
        x.lineWidth = Math.max(.6*r, s.s*.7);
        x.beginPath(); x.moveTo(px, py); x.lineTo(px + (px-cx)*k, py + (py-cy)*k); x.stroke();
      } else {
        const sz = s.s*6*(.85 + .15*tw);
        x.globalAlpha = Math.min(1, .35 + .65*tw*s.z);
        x.drawImage(SPR[s.c], px - sz/2, py - sz/2, sz, sz);
        if(s.s > 2.4*r){
          x.globalAlpha *= .35; x.strokeStyle = '#fff'; x.lineWidth = r*.6;
          const L = s.s*5*tw;
          x.beginPath(); x.moveTo(px-L,py); x.lineTo(px+L,py); x.moveTo(px,py-L); x.lineTo(px,py+L); x.stroke();
        }
      }
    }
    x.globalAlpha = 1;
    if(!shoot && Math.random() < .004) shoot = { x:Math.random()*W*.7, y:Math.random()*H*.4, l:0, a:.4 + Math.random()*.3 };
    if(shoot){
      const sp = 16*r; shoot.x += sp*Math.cos(shoot.a); shoot.y += sp*Math.sin(shoot.a); shoot.l++;
      const tx = shoot.x - Math.cos(shoot.a)*140*r, ty = shoot.y - Math.sin(shoot.a)*140*r;
      const fade = Math.sin(Math.min(1, shoot.l/45)*Math.PI);
      const g = x.createLinearGradient(shoot.x,shoot.y,tx,ty);
      g.addColorStop(0,`rgba(255,255,255,${.9*fade})`); g.addColorStop(1,'rgba(255,255,255,0)');
      x.strokeStyle = g; x.lineWidth = 1.4*r;
      x.beginPath(); x.moveTo(shoot.x,shoot.y); x.lineTo(tx,ty); x.stroke();
      if(shoot.l > 45) shoot = null;
    }
    requestAnimationFrame(loop);
  })();
  return { warp(p = 1){ wt = p; zt += .22; } };
})();
</script>
